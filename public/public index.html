
<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bhabhi Thola Online</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;background:#06140b;color:#fff}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#123d1d,#031008 65%);min-height:100vh}
main{max-width:1100px;margin:auto;padding:22px}.card{background:#071b10cc;border:1px solid #416a43;border-radius:18px;padding:20px;box-shadow:0 12px 40px #0008}
h1{color:#f4c443;text-align:center;font-size:42px;margin:8px 0 20px}
.row{display:flex;gap:12px;flex-wrap:wrap}.grow{flex:1}
input,button{border-radius:10px;padding:13px 15px;font-size:16px;border:1px solid #5d765d}
input{background:#08130c;color:#fff;width:100%}button{cursor:pointer;background:#d99b14;color:#111;font-weight:800}
button.green{background:#2d9c45;color:#fff}.danger{background:#a42b20;color:#fff}.muted{opacity:.7}
.hidden{display:none}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.player{padding:12px;border:1px solid #335b38;border-radius:12px;background:#08150c}.active{outline:2px solid #f4c443}
.table{margin-top:18px;min-height:430px;border-radius:28px;background:radial-gradient(circle,#17602c,#073017 60%,#05200e);border:10px solid #4c3016;padding:22px;position:relative}
.center{text-align:center;margin-top:65px}.pile{display:flex;justify-content:center;flex-wrap:wrap;min-height:150px;align-items:center}
.playing{width:70px;height:98px;background:#fff;color:#111;border-radius:9px;margin:-8px 3px;box-shadow:0 5px 15px #0008;padding:8px;font-weight:900}
.red{color:#b31919}.hand{display:flex;overflow-x:auto;justify-content:center;padding:20px 5px;min-height:140px}
.hand .playing{margin:0 -4px;transition:.15s}.hand .playing:hover{transform:translateY(-12px);z-index:2}
.status{margin:12px 0;padding:12px;border-radius:10px;background:#102619}.roomcode{font-size:30px;letter-spacing:5px;color:#f4c443}
</style>
</head>
<body>
<main>
<h1>♠ ♥ BHABHI THOLA ♦ ♣</h1>

<section id="home" class="card">
  <h2>Online Multiplayer</h2>
  <input id="name" placeholder="Your player name" maxlength="20"/>
  <div class="row" style="margin-top:12px">
    <button class="grow" onclick="createRoom()">CREATE ROOM</button>
    <div class="grow"><input id="code" placeholder="6-digit room code"/></div>
    <button class="grow green" onclick="joinRoom()">JOIN ROOM</button>
  </div>
  <p class="muted">2–6 players • Real-time • Worldwide</p>
</section>

<section id="lobby" class="card hidden">
  <div class="row"><div class="grow"><h2>Waiting Room</h2><div>Room Code: <span class="roomcode" id="roomCode"></span></div></div><button class="danger" onclick="location.reload()">LEAVE</button></div>
  <div id="players" class="players" style="margin-top:16px"></div>
  <div class="row" style="margin-top:16px"><button class="green" onclick="toggleReady()">READY / NOT READY</button><button id="start" onclick="startGame()">START GAME</button></div>
</section>

<section id="game" class="card hidden">
  <div class="row"><div class="grow"><b id="turnText"></b></div><button onclick="thola()">THOLA</button></div>
  <div class="table">
    <div id="others" class="players"></div>
    <div class="center">
      <h3>CARDS IN CENTER</h3>
      <div id="pile" class="pile"></div>
      <div id="message" class="status">Waiting...</div>
    </div>
  </div>
  <h3>Your Cards</h3>
  <div id="hand" class="hand"></div>
</section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
let myId=socket.id, myHand=[], room=null;
socket.on("connect",()=>myId=socket.id);
function name(){return document.getElementById("name").value.trim()||"Player"}
function createRoom(){socket.emit("room:create",{name:name()})}
function joinRoom(){socket.emit("room:join",{name:name(),code:document.getElementById("code").value})}
function toggleReady(){socket.emit("player:ready")}
function startGame(){socket.emit("game:start")}
function thola(){socket.emit("thola")}
socket.on("room:created",()=>{showLobby()})
socket.on("room:joined",()=>{showLobby()})
socket.on("hand:update",h=>{myHand=h; render()})
socket.on("room:update",r=>{room=r; render()})
socket.on("game:winner",e=>alert("🏆 "+e.name+" won the game!"))
socket.on("game:thola",e=>setMessage("THOLA! "+e.name+" collected the center cards."))
socket.on("error:message",m=>alert(m))
function showLobby(){home.classList.add("hidden");lobby.classList.remove("hidden");roomCode.textContent=document.getElementById("code").value||"—"}
function setMessage(m){document.getElementById("message").textContent=m}
function card(c,click=false){const d=document.createElement("button");d.className="playing "+(c.color==="red"?"red":"");d.innerHTML="<div>"+c.rank+"</div><div style='font-size:28px'>"+c.suit+"</div>";if(click)d.onclick=()=>socket.emit("card:play",{cardId:c.id});return d}
function render(){
 if(!room)return;
 if(room.started){lobby.classList.add("hidden");game.classList.remove("hidden")}else{lobby.classList.remove("hidden");game.classList.add("hidden")}
 roomCode.textContent=room.code;
 players.innerHTML=room.players.map((p,i)=>`<div class="player ${room.turn===i&&room.started?'active':''}"><b>${p.name}${p.host?' 👑':''}</b><br>${p.cards} cards<br><span class="muted">${p.ready?'READY':'NOT READY'}</span></div>`).join("");
 start.style.display=(room.hostId===myId?"inline-block":"none");
 turnText.textContent=room.started ? "Turn: "+(room.players[room.turn]?.name||"") : "";
 pile.innerHTML=""; room.pile.forEach(c=>pile.appendChild(card(c)));
 hand.innerHTML=""; myHand.forEach(c=>hand.appendChild(card(c,true)));
 others.innerHTML=room.players.filter(p=>p.id!==myId).map(p=>`<div class="player"><b>${p.name}</b><br>${p.cards} cards</div>`).join("");
 if(room.started && room.players[room.turn]?.id===myId)setMessage("Your turn — choose a card, or press THOLA to award the center pile to the highest card.");
}
</script>
</body>
</html>
